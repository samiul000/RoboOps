[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roboops-agent"
version = "0.1.0"
description = "RoboOps Autonomous Fleet Incident Triage Agent powered by TrueForge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "openai>=1.30.0",
    "rosbags>=0.9.0",
    "numpy>=1.24.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools]
packages = ["mcp_server", "sandbox", "agent", "database"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]